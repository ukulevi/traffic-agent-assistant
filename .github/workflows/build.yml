name: Build LaTeX PDF -- STWI Technical Report v2.0

on:
  push:
    branches: [ main ]
    paths:
      - "report/**"
      - "report_en/**"
      - "docs/**"
      - "project_contract.json"
      - "scripts/validation/**"
      - "tests/contracts/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "report/**"
      - "report_en/**"
      - "docs/**"
      - "project_contract.json"
      - "scripts/validation/**"
      - "tests/contracts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub release after build"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: stwi-report-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Build Info
        run: |
          echo "=========================================="
          echo "  STWI Report Build v2.0"
          echo "  Triggered on: $GITHUB_REF @ ${GITHUB_SHA:0:8}"
          echo "  Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          ls -la
          echo "--- Chapter files (Vietnamese) ---"
          ls report/chapters/ 2>/dev/null || echo "(no chapters dir yet)"
          echo "--- Chapter files (English) ---"
          ls report_en/sections/ 2>/dev/null || echo "(no sections dir yet)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate canonical contract and documentation
        run: |
          python scripts/validation/validate_docs.py
          python -m unittest tests.contracts.test_project_contract

      - name: Compile Vietnamese Technical Report (report/main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          args: >-
            -xelatex
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error

      - name: Compile English Capstone Report (report_en/main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report_en
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          args: >-
            -xelatex
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error

      - name: Capture LaTeX Errors
        if: failure()
        run: |
          {
            echo "# LaTeX Build Error Log (Run ${{ github.run_number }})"
            echo "SHA: ${GITHUB_SHA:0:8} | $(date -u)"
            echo ""
            echo "## Fatal Errors (lines with !)"
            grep -n "^!" report/main.log report_en/main.log 2>/dev/null | head -50 || echo "(no ! lines)"
            echo ""
            echo "## Error keywords"
            grep -n "Error\|Undefined\|undefined\|Missing\|Emergency stop\|Fatal" report/main.log report_en/main.log 2>/dev/null | head -60 || echo "(none)"
            echo ""
            echo "## Last 200 lines of main.log"
            tail -200 report/main.log report_en/main.log 2>/dev/null || echo "(main.log not found)"
          } > latex_errors.md

      - name: Verify PDFs were created
        run: |
          if [ -f report/main.pdf ] && [ -f report_en/main.pdf ]; then
            echo "[OK] Both report/main.pdf and report_en/main.pdf generated successfully"
            ls -lh report/main.pdf report_en/main.pdf
          else
            echo "[ERROR] PDFs NOT found!"
            exit 1
          fi

      - name: Name and Package Build Artifacts
        run: |
          pip install pypdf
          VERSION="v$(date -u +'%Y%m%d')-build${{ github.run_number }}"
          python scripts/report/assemble_internship_report.py --main-pdf report/main.pdf --output "STWI_Technical_Report_VI_${VERSION}.pdf" --allow-missing-d2
          python scripts/report/assemble_internship_report.py --main-pdf report_en/main.pdf --output "STWI_Capstone_Report_EN_${VERSION}.pdf" --allow-missing-d2
          echo "REPORT_NAME=STWI_Capstone_Report_EN_${VERSION}" >> $GITHUB_ENV
          echo "Built Vietnamese and English reports successfully."

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stwi-technical-reports-pdf
          path: "*.pdf"
          retention-days: 14

      - name: Upload LaTeX Logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-build-logs
          path: |
            report/main.log
            report_en/main.log
            latex_errors.md
          retention-days: 3

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-pdf
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes from Commit History
        id: release_notes
        run: |
          set -euo pipefail

          LAST_TAG=""
          if git describe --tags --abbrev=0 2>/dev/null; then
            LAST_TAG=$(git describe --tags --abbrev=0)
          fi

          {
            echo "## STWI Technical & Capstone Reports v2.0 -- Build ${{ github.run_number }}"
            echo ""
            echo "**SmartTraffic What-If (STWI)** -- Intelligent Urban Traffic Control Decision-Support System"
            echo "using Multi-Agent AI, Counterfactual Safety Verification, and Legal RAG."
            echo ""
            echo "### Included Technical Reports"
            echo ""
            echo "| Document | Language | Description |"
            echo "|----------|----------|-------------|"
            echo "| STWI Technical Report | Vietnamese (Tiếng Việt) | Báo cáo đặc tả kỹ thuật và hồ sơ thực tập tốt nghiệp chuẩn M1 |"
            echo "| STWI Capstone Report | English (Tiếng Anh) | Full English Capstone & Graduating Thesis Report (HCMUT CSE standard) |"
            echo ""
            echo "### Commit Changelog"
            echo ""
            if [ -n "$LAST_TAG" ]; then
              git log "${LAST_TAG}..HEAD" --no-merges \
                --pretty=format:"- **%s** (%h) -- %ad" \
                --date=short 2>/dev/null || echo "- (no new commits)"
            else
              git log --no-merges -20 \
                --pretty=format:"- **%s** (%h) -- %ad" \
                --date=short 2>/dev/null || echo "- (no commits)"
            fi
            echo ""
            echo ""
            echo "---"
            echo "_Build: ${{ github.run_number }} | SHA: ${GITHUB_SHA:0:8} | $(date -u +'%Y-%m-%d %H:%M UTC')_"
          } > release_notes.md

          echo "=== Release Notes Preview ==="
          head -40 release_notes.md

      - name: Download PDF Artifact
        uses: actions/download-artifact@v4
        with:
          name: stwi-technical-reports-pdf
          path: dist

      - name: List downloaded files
        run: ls -lh dist/

      - name: Create GitHub Release with PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Báo cáo Kỹ thuật & Capstone STWI v2.0 (Build ${{ github.run_number }})"
          body_path: release_notes.md
          files: dist/*.pdf
          draft: false
          prerelease: false
